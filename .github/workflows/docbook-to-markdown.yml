name: DocBook to Markdown

# Regenerates the Markdown edition of DMLex from the DocBook source with the
# OASIS converter (OASIS-Docs/publication-assurance, pinned release, DMLex
# profile), verifies it against the published OASIS Standard, and fails if the
# committed Markdown is stale. See tools/docbook-to-markdown/README.md.
#
# The blocking verification is against the snapshot of the published page
# that the release carries, so a Cloudflare challenge or an outage cannot
# fail the build. The live page is checked too, as a separate step that
# reports without blocking.

on:
  push:
    paths:
      - 'dmlex-v1.0/specification/**'
      - 'dmlex-v1.0/markdown/**'
      - '.github/workflows/docbook-to-markdown.yml'
  pull_request:
    paths:
      - 'dmlex-v1.0/specification/**'
      - 'dmlex-v1.0/markdown/**'
      - '.github/workflows/docbook-to-markdown.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PANDOC_VERSION: 3.8.2.1
  PA_REF: v1.10.0
  PUBLISHED_HTML: https://docs.oasis-open.org/lexidma/dmlex/v1.0/os/dmlex-v1.0-os.html

jobs:
  convert-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the OASIS converter at the pinned release
        uses: actions/checkout@v4
        with:
          repository: OASIS-Docs/publication-assurance
          ref: ${{ env.PA_REF }}
          path: _pa

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils graphviz m4
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1

      - name: Convert and verify against the published HTML (snapshot)
        run: |
          _pa/converters/docbook-to-markdown/build.sh --profile dmlex dmlex-v1.0/specification \
            "$RUNNER_TEMP/dmlex-markdown" _pa/tests/fixtures/verify_md/dmlex-v1.0-os/published-dmlex-v1.0-os.html

      - name: Check the committed Markdown is current
        run: |
          git diff --no-index --exit-code \
            dmlex-v1.0/markdown/dmlex-v1.0-os.md \
            "$RUNNER_TEMP/dmlex-markdown/dmlex-v1.0-os.md"

      - name: Verify against the live published page (reports, does not block)
        continue-on-error: true
        run: |
          python3 _pa/verify/verify_md.py "$RUNNER_TEMP/dmlex-markdown/dmlex-v1.0-os.md" "$PUBLISHED_HTML" \
            --allow _pa/converters/docbook-to-markdown/profiles/dmlex/allow.json | tail -1

      - name: Upload the generated Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmlex-markdown
          path: ${{ runner.temp }}/dmlex-markdown
          if-no-files-found: error
